name: CI

# Verify-only on every commit: compile the backend, build the frontend via Quinoa
# (which also runs `tsc --noEmit`), run whatever tests exist. No artifacts.
# Tags are handled by release.yml, not here (branches filter excludes refs/tags).

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (for Quinoa frontend build)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — typecheck + unit tests (Vitest)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

      # `mvnw verify` triggers the Quinoa build (npm install + `tsc --noEmit` + vite build)
      # during augmentation, and runs the backend tests (JUnit + @QuarkusTest, %test profile).
      # Augmentation also regenerates docs/api/openapi.yaml (store-schema-directory).
      - name: Verify (backend tests + compile + frontend build)
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      # OpenAPI-дрейф: закоммиченная спецификация обязана совпадать со сгенерированной.
      # Если менялись эндпоинты/схемы без перегенерации docs/api/openapi.yaml — падаем.
      - name: OpenAPI spec is up to date
        run: git diff --exit-code -- docs/api/openapi.yaml

      # Smoke-guard отдачи web-UI. %test отключает Quinoa, поэтому "/" не покрыт ни одним
      # @QuarkusTest. Поднимаем собранный fast-jar и проверяем, что "/" реально отдаёт SPA
      # (регрессия v0.0.9: top-level ключ mp: попал в середину quarkus: → потерялся
      # quarkus.quinoa → фронтенд не собирался и "/" отвечал 404).
      - name: Smoke — web UI is served at /
        working-directory: backend
        run: |
          java -jar target/quarkus-app/quarkus-run.jar > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/q/health/ready && break
            sleep 1
          done
          set -e
          body=$(curl -sf http://localhost:8080/)
          echo "$body" | grep -q '<div id="root"' \
            || { echo "FAIL: / did not serve index.html"; echo "$body" | head; exit 1; }
          curl -sf -o /dev/null http://localhost:8080/api/servers
          curl -sf -o /dev/null http://localhost:8080/q/openapi
          echo "smoke OK: / serves the SPA, /api and /q/openapi respond"
