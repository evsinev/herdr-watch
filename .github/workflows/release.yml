name: Release

# On a version tag (v*): build the fat-jar and native binaries (Linux/macOS/Windows),
# attach them to a GitHub Release, and push a JVM Docker image to GHCR.
# workflow_dispatch is allowed for dry-runs (builds + pushes image, but the Release
# step is guarded to tag pushes only).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

jobs:
  # ---- Platform-independent fat-jar (also feeds the Docker image) ----
  fatjar:
    name: Fat-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (for Quinoa frontend build)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build fat-jar
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress package -Puber -DskipTests

      - name: Stage jar
        run: |
          mkdir -p dist
          cp backend/target/herdr-watch-*-runner.jar "dist/herdr-watch-${GITHUB_REF_NAME}.jar"

      - uses: actions/upload-artifact@v7
        with:
          name: fatjar
          path: dist/*.jar

  # ---- Native binaries, one per OS (native image runs only on its build OS/arch) ----
  native:
    name: Native (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: linux-amd64,   ext: '' }
          - { os: macos-latest,   asset: macos-arm64,   ext: '' }
          - { os: windows-latest, asset: windows-amd64, ext: '.exe' }
    defaults:
      run:
        shell: bash   # git-bash on Windows: `./mvnw` and globs work uniformly
    steps:
      - uses: actions/checkout@v5

      # Provides GraalVM-for-JDK-21 (JAVA_HOME) and, on Windows, sets up the MSVC
      # build environment for native-image automatically (no manual vcvarsall.bat).
      - name: Set up GraalVM (community, JDK 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Set up Node (for Quinoa frontend build)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build native executable
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress package -Dnative -DskipTests

      - name: Stage binary
        run: |
          mkdir -p dist
          cp backend/target/herdr-watch-*-runner${{ matrix.ext }} \
             "dist/herdr-watch-${GITHUB_REF_NAME}-${{ matrix.asset }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.asset }}
          path: dist/*

  # ---- JVM Docker image built from the Quarkus fast-jar (layered), multi-arch, GHCR ----
  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node (for Quinoa frontend build)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build fast-jar (layered quarkus-app)
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress package -DskipTests

      - name: Put quarkus-app into build context
        run: cp -r backend/target/quarkus-app docker/quarkus-app

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # don't upload the .dockerbuild build-record artifact
        with:
          context: docker
          file: docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest

  # ---- macOS menu-bar tray .app (ad-hoc signed), zipped as a release asset ----
  tray:
    name: macOS tray app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build & assemble .app
        working-directory: tray-macos
        run: bash scripts/make-app.sh

      - name: Zip .app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent tray-macos/HerdrWatchTray.app \
            "dist/herdr-watch-tray-${GITHUB_REF_NAME}-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: tray
          path: dist/*.zip

  # ---- Publish the GitHub Release with all binaries (tag pushes only) ----
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [fatjar, native, docker, tray]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: List assets
        run: find dist -type f

      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/herdr-watch-*   # only our jar + native binaries, nothing else
          generate_release_notes: true
          body: |
            **Assets:** fat-jar, native binaries (Linux/macOS-arm64/Windows), and the
            macOS menu-bar tray app (`herdr-watch-tray-*-macos-arm64.zip`, ad-hoc signed —
            on first launch: right-click → Open).

            Docker image:
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
