quarkus:
  http:
    port: 8080
    cors:
      ~: true
      origins: "http://localhost:5173"   # Vite dev-сервер фронта
    # Не кешировать фронт агрессивно: по умолчанию Quinoa/Quarkus отдаёт статику с
    # `Cache-Control: public, immutable, max-age=86400`, из-за чего kiosk-браузеры (cog)
    # держат старый index.html сутки и не подхватывают пересборку. Отключаем дефолтный
    # immutable-кеш → браузер ревалидирует по Last-Modified и берёт свежую страницу.
    # Ассеты хешированы (новый билд = новый URL), так что потеря длинного кеша безвредна.
    static-resources:
      caching-enabled: false
  log:
    category:
      "com.payneteasy.herdrwatch":
        level: INFO
  # OpenAPI: на билде генерируем спецификацию в ../docs/api (openapi.yaml + openapi.json).
  # Закоммичен и проверяется в CI на дрейф. Snapshot API аннотирован @Schema/@Operation.
  smallrye-openapi:
    store-schema-directory: ../docs/api
    info-title: herdr-watch API
    info-version: "1"
    info-description: "herdr-watch REST/Snapshot API. Контракт Snapshot: docs/api/herdr-watch-snapshot-protocol.md"
  # Quinoa: сборка и отдача фронтенда из этого же Quarkus-приложения.
  # prod: `mvn package` соберёт ../frontend и упакует dist в jar.
  # dev:  `quarkus:dev` поднимет Vite (:5173) и будет проксировать к нему.
  quinoa:
    ui-dir: ../frontend        # фронтенд — сиблинг backend
    build-dir: dist            # выход Vite
    enable-spa-routing: true   # любой путь → index.html
    # что Quinoa НЕ трогает (отдаёт Quarkus'у) — и для SPA-хендлера, и для dev-прокси.
    # без этого /api форвардился бы на Vite и зацикливался с его прокси.
    ignored-path-prefixes:
      - /api
      - /q
    dev-server:
      port: 5173               # порт Vite, к которому Quinoa проксирует в dev

# OpenAPI-спецификация: версия 3.0.3 (совместимо со swagger-request-validator в тестах);
# servers пинуем на "/" — иначе smallrye автогенерит URL по http-порту, а он отличается
# между сборкой (:8080) и @QuarkusTest (:8081), что даёт нестабильный (дрейфующий) файл.
# ВАЖНО: `mp` — top-level ключ и ДОЛЖЕН идти ПОСЛЕ всего блока `quarkus:`. Если поставить его
# в середину `quarkus:`, YAML закроет mapping и «съест» следующие ключи (был баг: терялся
# quarkus.quinoa → Quinoa не собирала фронтенд и `/` отдавал 404).
mp:
  openapi:
    servers: /
    extensions:
      smallrye:
        openapi: "3.0.3"

# Bootstrap-список herdr-серверов для мониторинга.
# id      — логическое имя в UI
# host    — ssh-таргет (имя из ~/.ssh/config или user@host)
# Остальное необязательно (есть дефолты): herdr-path, poll-interval,
# reconnect-delay, enabled, ssh-extra-opts.
herdr-watch:
  # Telegram-оповещения: blocked («нужен ввод») и done («задача завершена»).
  # Значения обычно задаются через env; по умолчанию выключено.
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    notify-blocked: true
    notify-done: true
  # Дефолт для СБОРКИ-релиза (prod): один локальный хост через socket API herdr —
  # без bash/jq, кросс-платформенно (в т.ч. Windows: Java AF_UNIX SocketChannel).
  # Личный fleet разработчика вынесен в профиль "%dev" (ниже), чтобы не попадать в
  # скачиваемый бинарь. Свои хосты пользователь добавляет в Settings (state-файл).
  hosts:
    - id: local
      host: local              # ярлык (для local ssh-таргет не используется)
      local: true              # читать локальный herdr без ssh (текущий пользователь)
      data-source: SOCKET      # прямой unix-сокет herdr (без spawn'а bash/jq)
      poll-interval: 2

# Dev-профиль (./mvnw quarkus:dev): личный fleet разработчика. В prod-бинарь НЕ попадает.
# ВАЖНО: SmallRye накладывает список профиля на базовый ПО ИНДЕКСУ (пополе), а НЕ заменяет
# целиком, и список никогда не укорачивается. Поэтому: (1) индекс 0 здесь должен быть задан
# полностью (иначе унаследует data-source: SOCKET из базы) и (2) если база вырастет, профиль
# обязан покрыть не меньше индексов, иначе «протекут» базовые записи. Тот же инвариант — в "%test".
"%dev":
  herdr-watch:
    hosts:
      - id: local
        host: local
        local: true
        data-source: COMMAND   # явно перебиваем index0 = SOCKET из базы (см. заметку о
                               # merge-by-index над "%dev")
        herdr-path: /opt/homebrew/bin/herdr
        poll-interval: 2
      - id: m3-local
        host: m3-local         # обычный ssh-хост (имя из ~/.ssh/config)
        herdr-path: /opt/homebrew/bin/herdr
        poll-interval: 2
      - id: dqa1
        host: dqa1
        poll-interval: 2
      - id: dqa2
        host: dqa2
        poll-interval: 2

# Тестовый профиль (@QuarkusTest): без Quinoa (не звать npm/vite) и все bootstrap-хосты
# disabled → SourceManager не поднимает реальные ssh/bash-источники. (state-file не
# переопределяем: ключ herdr-watch.* вне @ConfigMapping ломает строгую валидацию.)
"%test":
  quarkus:
    quinoa:
      enabled: false
  herdr-watch:
    hosts:
      - { id: local,    host: local,    enabled: false }
      - { id: m3-local, host: m3-local, enabled: false }
      - { id: dqa1,     host: dqa1,     enabled: false }
      - { id: dqa2,     host: dqa2,     enabled: false }
